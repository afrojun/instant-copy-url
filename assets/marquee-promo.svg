<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560">
  <rect width="1400" height="560" fill="#172033"/>
  <rect width="22" height="560" fill="#3157f6"/>

  <text x="78" y="98" fill="#9bc5ff" font-family="Avenir Next, Arial, sans-serif" font-size="27" font-weight="700">Instant Copy URL</text>
  <text x="76" y="226" fill="#fff" font-family="Avenir Next, Arial, sans-serif" font-size="64" font-weight="700">Straight to your</text>
  <text x="76" y="298" fill="#fff" font-family="Avenir Next, Arial, sans-serif" font-size="64" font-weight="700">clipboard.</text>
  <text x="79" y="362" fill="#b8c6e3" font-family="Avenir Next, Arial, sans-serif" font-size="23">One shortcut skips the address bar.</text>

  <g transform="translate(78 410)" font-family="Avenir Next, Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">
    <rect width="64" height="78" rx="18" fill="#fff"/>
    <text x="32" y="51" fill="#172033">⌘</text>
    <rect x="76" width="64" height="78" rx="18" fill="#fff"/>
    <text x="108" y="51" fill="#172033">⇧</text>
    <rect x="152" width="64" height="78" rx="18" fill="#fff"/>
    <text x="184" y="51" fill="#172033">C</text>
  </g>
  <text x="326" y="457" fill="#9bc5ff" font-family="Avenir Next, Arial, sans-serif" font-size="18">Ctrl+Shift+C on Windows and Linux</text>

  <image href="icon.svg" x="830" y="66" width="430" height="430"/>
</svg>
