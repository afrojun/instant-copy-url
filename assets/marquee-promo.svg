  <text x="174" y="101" fill="#fff" font-family="Avenir Next, Arial, sans-serif" font-size="27" font-weight="700">Instant Copy URL</text>
  <text x="76" y="225" fill="#fff" font-family="Avenir Next, Arial, sans-serif" font-size="62" font-weight="700">Straight to your</text>
