    <text x="167" y="65" fill="#172033" font-size="41">⇧</text>
    <rect x="236" width="98" height="98" rx="20" fill="#fff" stroke="#9bc5ff" stroke-width="3"/>
    <text x="285" y="65" fill="#172033" font-size="41">C</text>
  </g>

  <path d="M1096 226h44" fill="none" stroke="#9bc5ff" stroke-linecap="round" stroke-width="5"/>
  <path d="m1128 213 13 13-13 13" fill="none" stroke="#9bc5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>

